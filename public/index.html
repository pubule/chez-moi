<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chez moi</title>
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- dietro Cloudflare Access: senza il cookie il manifest sarebbe la pagina di login -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chez moi">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="vista" aria-busy="true">
    <!-- scheletro della Sfida: si vede subito, finché arrivano i dati -->
    <div class="ossa" style="height: 2.4rem; width: 55%; margin: 12px 0 16px"></div>
    <div class="ossa" style="height: 150px; border-radius: 24px; margin-bottom: 16px"></div>
    <div class="ossa" style="height: 1rem; margin-bottom: 8px"></div>
    <div class="ossa" style="height: 1rem; width: 80%; margin-bottom: 16px"></div>
    <div class="ossa" style="height: 200px; border-radius: 20px"></div>
  </main>
  <nav>
    <button data-vista="sfida"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5.5 5.5 5.5 11a5.5 5.5 0 0 1-11 0c0-2.3 1-4 2.3-5.2 0 2.2 1 3.4 2.2 3.4C11 8 11 5 12 2z"/></svg>Sfida</button>
    <button data-vista="diario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.8c2.8-1.2 5.8-1.1 7.8.5v15c-2-1.5-5-1.6-7.8-.5zm17 0c-2.8-1.2-5.8-1.1-7.8.5v15c2-1.5 5-1.6 7.8-.5z"/></svg>Diario</button>
    <button data-vista="ricette"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 5.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zm0 2.3a4.2 4.2 0 1 0 0 8.4 4.2 4.2 0 0 0 0-8.4z"/><path d="M1.5 3h.8v4.2h.7V3h.8v4.2h.7V3h.8v5.4c0 .9-.6 1.6-1.4 1.8V21H2.9V10.2c-.8-.2-1.4-.9-1.4-1.8zM20.6 3c1.2 1 1.9 3 1.9 5.5V12h-1.2v9h-1.4V3.2z"/></svg>Ricette</button>
    <button data-vista="chef"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17h10v3.5H7zm-.5-1.5c-.2-1.4-.9-2.2-1.7-2.9A3.9 3.9 0 0 1 8 5.8a4.6 4.6 0 0 1 8 0 3.9 3.9 0 0 1 3.2 6.8c-.8.7-1.5 1.5-1.7 2.9z"/></svg>Chef</button>
    <button data-vista="impostazioni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/><circle cx="8" cy="7" r="2.6"/><circle cx="16" cy="12" r="2.6"/><circle cx="10" cy="17" r="2.6"/></svg>Opzioni</button>
  </nav>
  <dialog id="modulo"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
